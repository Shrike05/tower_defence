[package]
name = "tower_defence"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.1"
derive-new = "0.7.0"
rayon = "1.11.0"
regex = "1.12.1"
serde = { version = "1.0", features = ["derive"] }
bevy_common_assets = { version = "0.17", features = ["toml"] } # Or "ron"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unused = "allow"
